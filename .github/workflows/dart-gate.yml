name: Dart Gate

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dart-gate-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_SUPPRESS_ANALYTICS: "true"
  PUB_ENVIRONMENT: flutter_matter_ci

jobs:
  dart-check-and-tests:
    name: Dart check and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Read Flutter version
        shell: bash
        run: |
          flutter_version="$(jq -r '.flutter // empty' .fvmrc)"
          if [[ -z "${flutter_version}" ]]; then
            echo "::error::.fvmrc does not define a Flutter version."
            exit 1
          fi
          echo "FLUTTER_VERSION=${flutter_version}" >> "${GITHUB_ENV}"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve plugin dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run plugin Dart tests
        run: flutter test
